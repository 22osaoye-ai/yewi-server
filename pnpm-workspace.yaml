packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@firebase/util': true
  '@prisma/engines': true
  '@scarf/scarf': true
  argon2: true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  prisma: true
  protobufjs: true
  stream-chat: true
  unrs-resolver: true
  utf-8-validate: true

nodeLinker: hoisted

overrides:
  deepmerge-ts: '>=8.0.0'
  '@react-native/metro-config': '0.86.3'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5.0.0'
    utf-8-validate: '>=5.0.2'
    '@react-native/metro-config': '>=0.86.0'
