services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: yewi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yewi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yewi_secure_pass}
      POSTGRES_DB: ${DB_NAME:-yewi_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yewi_user} -d ${DB_NAME:-yewi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yewi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
